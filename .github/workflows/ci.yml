name: java-ci
on: [push, pull_request]
jobs:
  package:
    strategy: {matrix: {java: ['17', '21']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '${{ matrix.java }}'}
      - run: mvn --batch-mode package
